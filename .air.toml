# Air configuration for Kokekokkor live reloading
# Supports Go, templ components, and Tailwind CSS automatic rebuilds.

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  cmd = "go build -trimpath -o ./tmp/main ./cmd/kokekokkor"
  bin = "./tmp/main"
  entrypoint = ["./tmp/main"]
  pre_cmd = ["make web"]
  delay = 500
  exclude_dir = ["bin", "tmp", "vendor", "testdata", "node_modules", ".git"]
  exclude_file = ["web/static/css/styles.css"]
  exclude_regex = [".*_test\\.go", ".*_templ\\.go", "web/static/css/styles\\.css"]
  include_dir = []
  include_ext = ["go", "templ", "css", "html", "svg"]
  include_file = []
  kill_delay = "500ms"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true
