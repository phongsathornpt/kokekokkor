name: fix-anthropic-stop

on:
  push:
    branches: [feat/stream-events]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collapse duplicate stop handlers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("internal/protocol/anthropic/messages_stream.go")
          text = p.read_text()
          section = text.index('case "content_block_stop":')
          marker = '\t\t\tif thinkingBlocks[wire.Index] {'
          first = text.index(marker, section)
          stop = text.index('\t\t\treturn emit(llm.StreamEvent{Type: llm.StreamEventContentStop', first)
          second = text.find(marker, first + len(marker), stop)
          if second >= 0:
              block = text[first:second]
              text = text[:first] + block + text[stop:]
              p.write_text(text)
          PY
          gofmt -w internal/protocol/anthropic/messages_stream.go
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/protocol/anthropic/messages_stream.go
          git commit -m 'fix: normalize Anthropic summary stop handling'
          git push origin HEAD:feat/stream-events
