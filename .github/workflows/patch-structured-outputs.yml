          old_end = start.index('\nfunc cloneAnthropicRaw(', old_start)
          replacement = r'''func decodeAnthropicOutputConfig(raw json.RawMessage) (string, *llm.ResponseFormat, json.RawMessage, error) {
    var object map[string]json.RawMessage
    if err := json.Unmarshal(raw, &object); err != nil {
        return "", nil, nil, fmt.Errorf("decode Anthropic output_config: %w", err)
    }
    var effort string
    if value, ok := object["effort"]; ok {
        if err := json.Unmarshal(value, &effort); err != nil {
            return "", nil, nil, fmt.Errorf("decode Anthropic output_config.effort: %w", err)
        }
        delete(object, "effort")
    }
    var responseFormat *llm.ResponseFormat
    if value, ok := object["format"]; ok {
        var format struct {
            Type   string          `json:"type"`
            Schema json.RawMessage `json:"schema"`
        }
        if err := json.Unmarshal(value, &format); err != nil {
            return "", nil, nil, fmt.Errorf("decode Anthropic output_config.format: %w", err)
        }
        if format.Type != "json_schema" {
            return "", nil, nil, fmt.Errorf("unsupported Anthropic output format %q", format.Type)
        }
        responseFormat = &llm.ResponseFormat{JSONSchema: cloneAnthropicRaw(format.Schema), Strict: true}
        delete(object, "format")
    }
    if len(object) == 0 {
        return effort, responseFormat, nil, nil
    }
    extras, err := json.Marshal(object)
    if err != nil {
        return "", nil, nil, err
    }
    return effort, responseFormat, extras, nil
}

func encodeAnthropicOutputConfig(reasoning *llm.ReasoningConfig, format *llm.ResponseFormat) (json.RawMessage, error) {
    value := make(map[string]any, 2)
    if reasoning != nil && reasoning.Effort != "" {
        switch reasoning.Effort {
        case "low", "medium", "high", "xhigh", "max":
        default:
            return nil, fmt.Errorf("unsupported Anthropic effort %q", reasoning.Effort)
        }
        value["effort"] = reasoning.Effort
    }
    if format != nil {
        value["format"] = map[string]any{
            "type":   "json_schema",
            "schema": json.RawMessage(format.JSONSchema),
        }
    }
    if len(value) == 0 {
        return nil, nil
    }
    return json.Marshal(value)
}
