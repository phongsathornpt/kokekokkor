name: patch-structured-outputs

on:
  push:
    branches: [feat/structured-outputs]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - name: Apply structured output support
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "internal/protocol/openai/responses_wire.go",
              '\tReasoning         *responseReasoningConfig `json:"reasoning,omitempty"`\n\tStream            bool                     `json:"stream,omitempty"`',
              '\tReasoning         *responseReasoningConfig `json:"reasoning,omitempty"`\n\tText              json.RawMessage          `json:"text,omitempty"`\n\tStream            bool                     `json:"stream,omitempty"`',
          )
          replace(
              "internal/protocol/openai/responses_decode.go",
              '\t\t"parallel_tool_calls", "max_output_tokens", "temperature", "top_p", "reasoning",\n',
              '\t\t"parallel_tool_calls", "max_output_tokens", "temperature", "top_p", "reasoning", "text",\n',
          )
          replace(
              "internal/protocol/openai/responses_decode.go",
              '''\tif wire.Reasoning != nil {\n\t\trequest.Reasoning = decodeResponsesReasoning(*wire.Reasoning)\n\t}\n''',
              '''\tif wire.Reasoning != nil {\n\t\trequest.Reasoning = decodeResponsesReasoning(*wire.Reasoning)\n\t}\n\tif len(wire.Text) != 0 && string(wire.Text) != "null" {\n\t\tformat, extras, err := decodeResponsesTextConfig(wire.Text)\n\t\tif err != nil {\n\t\t\treturn llm.Request{}, err\n\t\t}\n\t\trequest.ResponseFormat = format\n\t\tif len(extras) != 0 {\n\t\t\tif request.Metadata == nil {\n\t\t\t\trequest.Metadata = make(map[string]json.RawMessage)\n\t\t\t}\n\t\t\trequest.Metadata["openai.responses.text"] = extras\n\t\t}\n\t}\n''',
          )

          Path("internal/protocol/openai/responses_format.go").write_text(r'''package openai

import (
    "bytes"
    "encoding/json"
    "fmt"

    "github.com/phongsathornpt/kokekokkor/internal/domain/llm"
)

func decodeResponsesTextConfig(raw json.RawMessage) (*llm.ResponseFormat, json.RawMessage, error) {
    trimmed := bytes.TrimSpace(raw)
    if len(trimmed) == 0 || bytes.Equal(trimmed, []byte("null")) {
        return nil, nil, nil
    }
    var object map[string]json.RawMessage
    if err := json.Unmarshal(trimmed, &object); err != nil {
        return nil, nil, fmt.Errorf("decode Responses text config: %w", err)
    }

    var responseFormat *llm.ResponseFormat
    if formatRaw, ok := object["format"]; ok {
        delete(object, "format")
        var format struct {
            Type        string          `json:"type"`
            Name        string          `json:"name"`
            Description string          `json:"description"`
            Schema      json.RawMessage `json:"schema"`
            Strict      bool            `json:"strict"`
        }
        if err := json.Unmarshal(formatRaw, &format); err != nil {
            return nil, nil, fmt.Errorf("decode Responses text.format: %w", err)
        }
        switch format.Type {
        case "", "text":
        case "json_schema":
            responseFormat = &llm.ResponseFormat{
                Name:        format.Name,
                Description: format.Description,
                JSONSchema:  cloneRaw(format.Schema),
                Strict:      format.Strict,
            }
        default:
            object["format"] = cloneRaw(formatRaw)
        }
    }
    if len(object) == 0 {
        return responseFormat, nil, nil
    }
    extras, err := json.Marshal(object)
    if err != nil {
        return nil, nil, err
    }
    return responseFormat, extras, nil
}
''')

