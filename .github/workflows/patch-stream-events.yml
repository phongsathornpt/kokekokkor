name: patch-stream-events

on:
  push:
    branches: [feat/stream-events]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch stream codecs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"pattern missing in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          path = "internal/protocol/openai/responses_stream.go"
          replace(path,
              '''\tcase llm.StreamEventReasoningDelta:\n\t\treturn fmt.Errorf("reasoning stream events are not supported by Responses translation")''',
              '''\tcase llm.StreamEventReasoningDelta:\n\t\treturn e.writeReasoningDelta(event)''')
          replace(path,
              '''\tswitch block := event.Block.(type) {\n\tcase llm.TextBlock:''',
              '''\tswitch block := event.Block.(type) {\n\tcase llm.ReasoningBlock:\n\t\treturn e.startReasoningContent(event, block)\n\tcase llm.TextBlock:''')
          replace(path,
              '''\tswitch state.kind {\n\tcase "text":''',
              '''\tswitch state.kind {\n\tcase "reasoning":\n\t\treturn e.stopReasoningContent(state)\n\tcase "text":''')

          path = "internal/protocol/anthropic/messages_stream.go"
          replace(path,
              '''\tvar usage llm.Usage\n\tvar pendingStop llm.StopReason''',
              '''\tvar usage llm.Usage\n\tthinkingBlocks := make(map[int]bool)\n\tthinkingStarted := make(map[int]bool)\n\tvar pendingStop llm.StopReason''')
          replace(path,
              '''\t\t\t\t\tType  string          `json:"type"`\n\t\t\t\t\tText  string          `json:"text,omitempty"`\n\t\t\t\t\tID    string          `json:"id,omitempty"`''',
              '''\t\t\t\t\tType     string          `json:"type"`\n\t\t\t\t\tText     string          `json:"text,omitempty"`\n\t\t\t\t\tThinking string          `json:"thinking,omitempty"`\n\t\t\t\t\tID       string          `json:"id,omitempty"`''')
          replace(path,
              '''\t\t\tcase "thinking", "redacted_thinking":\n\t\t\t\treturn fmt.Errorf("Anthropic thinking stream blocks are not supported by cross-protocol translation")''',
              '''\t\t\tcase "thinking":\n\t\t\t\tthinkingBlocks[wire.Index] = true\n\t\t\t\tif wire.ContentBlock.Thinking == "" {\n\t\t\t\t\treturn nil\n\t\t\t\t}\n\t\t\t\tthinkingStarted[wire.Index] = true\n\t\t\t\tif err := emit(llm.StreamEvent{Type: llm.StreamEventContentStart, Index: wire.Index, Block: llm.ReasoningBlock{}}); err != nil {\n\t\t\t\t\treturn err\n\t\t\t\t}\n\t\t\t\treturn emit(llm.StreamEvent{Type: llm.StreamEventReasoningDelta, Index: wire.Index, ReasoningDelta: wire.ContentBlock.Thinking})\n\t\t\tcase "redacted_thinking":\n\t\t\t\tthinkingBlocks[wire.Index] = true\n\t\t\t\treturn nil''')
          replace(path,
              '''\t\t\tcase "thinking_delta", "signature_delta":\n\t\t\t\treturn fmt.Errorf("Anthropic thinking stream deltas are not supported by cross-protocol translation")''',
              '''\t\t\tcase "thinking_delta":\n\t\t\t\tif !thinkingBlocks[wire.Index] {\n\t\t\t\t\treturn fmt.Errorf("Anthropic thinking delta for unopened block %d", wire.Index)\n\t\t\t\t}\n\t\t\t\tif !thinkingStarted[wire.Index] {\n\t\t\t\t\tthinkingStarted[wire.Index] = true\n\t\t\t\t\tif err := emit(llm.StreamEvent{Type: llm.StreamEventContentStart, Index: wire.Index, Block: llm.ReasoningBlock{}}); err != nil {\n\t\t\t\t\t\treturn err\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\tif wire.Delta.Thinking == "" {\n\t\t\t\t\treturn nil\n\t\t\t\t}\n\t\t\t\treturn emit(llm.StreamEvent{Type: llm.StreamEventReasoningDelta, Index: wire.Index, ReasoningDelta: wire.Delta.Thinking})\n\t\t\tcase "signature_delta":\n\t\t\t\tif !thinkingBlocks[wire.Index] {\n\t\t\t\t\treturn fmt.Errorf("Anthropic signature delta for unopened block %d", wire.Index)\n\t\t\t\t}\n\t\t\t\treturn nil''')
          replace(path,
              '''\t\t\treturn emit(llm.StreamEvent{Type: llm.StreamEventContentStop, Index: wire.Index})\n\n\t\tcase "message_delta":''',
              '''\t\t\tif thinkingBlocks[wire.Index] {\n\t\t\t\tdelete(thinkingBlocks, wire.Index)\n\t\t\t\tstarted := thinkingStarted[wire.Index]\n\t\t\t\tdelete(thinkingStarted, wire.Index)\n\t\t\t\tif !started {\n\t\t\t\t\treturn nil\n\t\t\t\t}\n\t\t\t}\n\t\t\treturn emit(llm.StreamEvent{Type: llm.StreamEventContentStop, Index: wire.Index})\n\n\t\tcase "message_delta":''')

          path = "internal/protocol/gemini/stream.go"
          replace(path,
              '''func (d *geminiStreamDecoder) decodePart(part geminiPart) error {\n\tif part.Thought {\n\t\treturn fmt.Errorf("Gemini thought parts are not supported by translated streaming yet")\n\t}\n\tif part.Text != nil {''',
              '''func (d *geminiStreamDecoder) decodePart(part geminiPart) error {\n\tif part.Thought {\n\t\tif part.Text == nil || *part.Text == "" {\n\t\t\treturn nil\n\t\t}\n\t\tif err := d.ensureReasoning(); err != nil {\n\t\t\treturn err\n\t\t}\n\t\treturn d.emit(llm.StreamEvent{Type: llm.StreamEventReasoningDelta, Index: d.active.index, ReasoningDelta: *part.Text})\n\t}\n\tif part.ThoughtSignature != "" && part.Text != nil && *part.Text == "" && part.FunctionCall == nil && part.InlineData == nil && part.FileData == nil && part.FunctionResponse == nil {\n\t\treturn nil\n\t}\n\tif part.Text != nil {''')
          replace(path,
              '''func (d *geminiStreamDecoder) decodeFunctionCall(call geminiFunctionCall) error {''',
              '''func (d *geminiStreamDecoder) ensureReasoning() error {\n\tif d.active != nil && d.active.kind == "reasoning" {\n\t\treturn nil\n\t}\n\tif err := d.closeActive(); err != nil {\n\t\treturn err\n\t}\n\tblock := &geminiDecodeBlock{index: d.nextBlock, kind: "reasoning"}\n\td.nextBlock++\n\td.active = block\n\treturn d.emit(llm.StreamEvent{Type: llm.StreamEventContentStart, Index: block.index, Block: llm.ReasoningBlock{}})\n}\n\nfunc (d *geminiStreamDecoder) decodeFunctionCall(call geminiFunctionCall) error {''')
          PY
          gofmt -w internal/protocol/openai/responses_stream.go internal/protocol/anthropic/messages_stream.go internal/protocol/gemini/stream.go
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/protocol/openai/responses_stream.go internal/protocol/anthropic/messages_stream.go internal/protocol/gemini/stream.go
          git commit -m 'feat: decode and encode streamed summaries'
          git push origin HEAD:feat/stream-events
