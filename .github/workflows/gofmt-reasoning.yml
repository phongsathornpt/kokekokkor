name: gofmt-reasoning

on:
  push:
    branches: [feat/reasoning-translation]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Format and commit
        shell: bash
        run: |
          mapfile -t files < <(gofmt -l .)
          if (( ${#files[@]} == 0 )); then
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          gofmt -w "${files[@]}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "${files[@]}"
          git commit -m 'chore: gofmt reasoning translation'
          git push origin HEAD:feat/reasoning-translation
