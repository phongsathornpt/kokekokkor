name: patch-structured-source
on:
  push:
    branches:
      - feat/structured-outputs
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"match count {text.count(old)} in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace("internal/protocol/openai/responses_wire.go",
              '\tReasoning         *responseReasoningConfig `json:"reasoning,omitempty"`\n\tStream            bool                     `json:"stream,omitempty"`',
              '\tReasoning         *responseReasoningConfig `json:"reasoning,omitempty"`\n\tText              json.RawMessage          `json:"text,omitempty"`\n\tStream            bool                     `json:"stream,omitempty"`')
          replace("internal/protocol/openai/responses_decode.go",
              '\t\t"parallel_tool_calls", "max_output_tokens", "temperature", "top_p", "reasoning",\n',
              '\t\t"parallel_tool_calls", "max_output_tokens", "temperature", "top_p", "reasoning", "text",\n')
          replace("internal/protocol/openai/responses_decode.go",
              '\tif wire.Reasoning != nil {\n\t\trequest.Reasoning = decodeResponsesReasoning(*wire.Reasoning)\n\t}\n',
              '\tif wire.Reasoning != nil {\n\t\trequest.Reasoning = decodeResponsesReasoning(*wire.Reasoning)\n\t}\n\tif len(wire.Text) != 0 && string(wire.Text) != "null" {\n\t\tformat, extras, err := decodeResponsesTextConfig(wire.Text)\n\t\tif err != nil {\n\t\t\treturn llm.Request{}, err\n\t\t}\n\t\trequest.ResponseFormat = format\n\t\tif len(extras) != 0 {\n\t\t\tif request.Metadata == nil {\n\t\t\t\trequest.Metadata = make(map[string]json.RawMessage)\n\t\t\t}\n\t\t\trequest.Metadata["openai.responses.text"] = extras\n\t\t}\n\t}\n')
          replace("internal/protocol/openai/chat_response_format.go",
              '\tif format == nil {\n\t\treturn nil, nil\n\t}\n\treturn json.Marshal(map[string]any{',
              '\tif format == nil {\n\t\treturn nil, nil\n\t}\n\tname := format.Name\n\tif name == "" {\n\t\tname = "structured_output"\n\t}\n\treturn json.Marshal(map[string]any{')
          replace("internal/protocol/openai/chat_response_format.go", '"name":        format.Name,', '"name":        name,')

          replace("internal/protocol/anthropic/messages_codec.go",
              '\t\teffort, extras, err := decodeAnthropicOutputConfig(wire.OutputConfig)\n',
              '\t\teffort, format, extras, err := decodeAnthropicOutputConfig(wire.OutputConfig)\n')
          replace("internal/protocol/anthropic/messages_codec.go",
              '\t\t\trequest.Reasoning.Effort = effort\n\t\t}\n\t\tif len(extras) != 0 {',
              '\t\t\trequest.Reasoning.Effort = effort\n\t\t}\n\t\trequest.ResponseFormat = format\n\t\tif len(extras) != 0 {')
          replace("internal/protocol/anthropic/messages_codec.go",
              'wire.OutputConfig, err = encodeAnthropicOutputConfig(request.Reasoning)',
              'wire.OutputConfig, err = encodeAnthropicOutputConfig(request.Reasoning, request.ResponseFormat)')
          p = Path("internal/protocol/anthropic/messages_codec.go")
          text = p.read_text()
          start = text.index('func decodeAnthropicOutputConfig(')
          end = text.index('\nfunc cloneAnthropicRaw(', start)
          replacement = '''func decodeAnthropicOutputConfig(raw json.RawMessage) (string, *llm.ResponseFormat, json.RawMessage, error) {\n\tvar object map[string]json.RawMessage\n\tif err := json.Unmarshal(raw, &object); err != nil {\n\t\treturn "", nil, nil, fmt.Errorf("decode Anthropic output_config: %w", err)\n\t}\n\tvar effort string\n\tif value, ok := object["effort"]; ok {\n\t\tif err := json.Unmarshal(value, &effort); err != nil {\n\t\t\treturn "", nil, nil, fmt.Errorf("decode Anthropic output_config.effort: %w", err)\n\t\t}\n\t\tdelete(object, "effort")\n\t}\n\tvar format *llm.ResponseFormat\n\tif value, ok := object["format"]; ok {\n\t\tvar wire struct { Type string `json:"type"`; Schema json.RawMessage `json:"schema"` }\n\t\tif err := json.Unmarshal(value, &wire); err != nil { return "", nil, nil, fmt.Errorf("decode Anthropic output_config.format: %w", err) }\n\t\tif wire.Type != "json_schema" { return "", nil, nil, fmt.Errorf("unsupported Anthropic output format %q", wire.Type) }\n\t\tformat = &llm.ResponseFormat{JSONSchema: cloneAnthropicRaw(wire.Schema), Strict: true}\n\t\tdelete(object, "format")\n\t}\n\tif len(object) == 0 { return effort, format, nil, nil }\n\textras, err := json.Marshal(object)\n\tif err != nil { return "", nil, nil, err }\n\treturn effort, format, extras, nil\n}\n\nfunc encodeAnthropicOutputConfig(reasoning *llm.ReasoningConfig, format *llm.ResponseFormat) (json.RawMessage, error) {\n\tvalue := make(map[string]any, 2)\n\tif reasoning != nil && reasoning.Effort != "" {\n\t\tswitch reasoning.Effort { case "low", "medium", "high", "xhigh", "max": default: return nil, fmt.Errorf("unsupported Anthropic effort %q", reasoning.Effort) }\n\t\tvalue["effort"] = reasoning.Effort\n\t}\n\tif format != nil { value["format"] = map[string]any{"type": "json_schema", "schema": json.RawMessage(format.JSONSchema)} }\n\tif len(value) == 0 { return nil, nil }\n\treturn json.Marshal(value)\n}\n'''
          p.write_text(text[:start] + replacement + text[end:])

          replace("internal/protocol/gemini/wire.go",
              '\tThinkingConfig  *geminiThinkingConfig `json:"thinkingConfig,omitempty"`',
              '\tThinkingConfig  *geminiThinkingConfig `json:"thinkingConfig,omitempty"`\n\tResponseFormat  json.RawMessage       `json:"responseFormat,omitempty"`')
          replace("internal/protocol/gemini/request_codec.go",
              'nestedExtras(data, "generationConfig", "maxOutputTokens", "temperature", "topP", "stopSequences", "thinkingConfig")',
              'nestedExtras(data, "generationConfig", "maxOutputTokens", "temperature", "topP", "stopSequences", "thinkingConfig", "responseFormat")')
          replace("internal/protocol/gemini/request_codec.go",
              '\t\t\trequest.Reasoning = reasoning\n\t\t}\n\t}\n',
              '\t\t\trequest.Reasoning = reasoning\n\t\t}\n\t\tif len(wire.GenerationConfig.ResponseFormat) != 0 {\n\t\t\tformat, err := decodeGeminiResponseFormat(wire.GenerationConfig.ResponseFormat)\n\t\t\tif err != nil { return llm.Request{}, err }\n\t\t\trequest.ResponseFormat = format\n\t\t}\n\t}\n')
          replace("internal/protocol/gemini/request_codec.go",
              'if request.MaxOutputTokens != nil || request.Temperature != nil || request.TopP != nil || len(request.Stop) != 0 || request.Reasoning != nil {',
              'if request.MaxOutputTokens != nil || request.Temperature != nil || request.TopP != nil || len(request.Stop) != 0 || request.Reasoning != nil || request.ResponseFormat != nil {')
          replace("internal/protocol/gemini/request_codec.go",
              '\t\t\twire.GenerationConfig.ThinkingConfig = thinking\n\t\t}\n\t}\n\tdata, err := json.Marshal(wire)',
              '\t\t\twire.GenerationConfig.ThinkingConfig = thinking\n\t\t}\n\t\tif request.ResponseFormat != nil {\n\t\t\tformat, err := encodeGeminiResponseFormat(request.ResponseFormat)\n\t\t\tif err != nil { return nil, err }\n\t\t\twire.GenerationConfig.ResponseFormat = format\n\t\t}\n\t}\n\tdata, err := json.Marshal(wire)')

          removals = {
              "internal/application/translation/compatibility.go": [
                  '\tif request.ResponseFormat != nil {\n\t\treturn llm.Request{}, unsupported("response_format", "structured-output translation is not implemented yet")\n\t}\n'],
              "internal/application/translation/gemini.go": [
                  '\tif request.ResponseFormat != nil {\n\t\treturn llm.Request{}, unsupported("response_format", "structured-output translation is not implemented for Gemini yet")\n\t}\n',
                  '\tif request.ResponseFormat != nil {\n\t\treturn llm.Request{}, unsupported("response format", "Gemini structured-output controls cannot yet be represented in Chat Completions")\n\t}\n'],
              "internal/application/translation/responses_gemini.go": [
                  '\tif request.ResponseFormat != nil {\n\t\treturn llm.Request{}, unsupported("response_format", "Responses structured-output translation to Gemini is not implemented yet")\n\t}\n'],
              "internal/application/translation/anthropic_gemini.go": [
                  '\tif request.ResponseFormat != nil {\n\t\treturn llm.Request{}, unsupported("response format", "structured-output translation to Gemini is not implemented")\n\t}\n',
                  '\tif request.ResponseFormat != nil {\n\t\treturn llm.Request{}, unsupported("response format", "Gemini structured-output controls cannot yet be represented in Anthropic Messages")\n\t}\n'],
          }
          for path, blocks in removals.items():
              for block in blocks: replace(path, block, '')
          replace("internal/application/translation/gemini_test.go",
              '\t\t{\n\t\t\tname: "structured output",\n\t\t\trequest: llm.Request{\n\t\t\t\tMessages:       []llm.Message{{Role: llm.RoleUser, Content: []llm.ContentBlock{llm.TextBlock{Text: "hi"}}}},\n\t\t\t\tResponseFormat: &llm.ResponseFormat{JSONSchema: json.RawMessage(`{"type":"object"}`)},\n\t\t\t},\n\t\t},\n', '')
          PY
          gofmt -w internal/protocol/openai internal/protocol/anthropic internal/protocol/gemini internal/application/translation
          git diff --check
          git rm .github/workflows/patch-structured-source.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/protocol/openai internal/protocol/anthropic internal/protocol/gemini internal/application/translation
          git commit -m 'feat: wire structured JSON outputs'
          git push origin HEAD:feat/structured-outputs
