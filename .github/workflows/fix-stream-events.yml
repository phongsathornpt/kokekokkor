name: fix-stream-events

on:
  push:
    branches: [feat/stream-events]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair generated patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("internal/protocol/gemini/stream.go")
          text = p.read_text()
          marker = "func (d *geminiStreamDecoder) ensureReasoning() error {"
          first = text.index(marker)
          second = text.find(marker, first + len(marker))
          if second >= 0:
              block = text[first:second]
              next_func = text.index("func (d *geminiStreamDecoder) decodeFunctionCall", second)
              text = text[:first] + block + text[next_func:]
          old = 'if part.ThoughtSignature != "" && part.Text != nil && *part.Text == "" && part.FunctionCall == nil && part.InlineData == nil && part.FileData == nil && part.FunctionResponse == nil {'
          new = 'if part.ThoughtSignature != "" && (part.Text == nil || *part.Text == "") && part.FunctionCall == nil && part.InlineData == nil && part.FileData == nil && part.FunctionResponse == nil {'
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          gofmt -w internal/protocol/gemini/stream.go
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/protocol/gemini/stream.go
          git commit -m 'fix: normalize Gemini summary decoder'
          git push origin HEAD:feat/stream-events
